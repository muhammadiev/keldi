name: keldim
description: "Keldim — maktab davomat (keldi/ketdi) ilovasi."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking + platform
  http: ^1.2.2
  geolocator: ^12.0.0          # GPS. NOTE: this version uses LocationSettings.
  shared_preferences: ^2.3.2   # token + theme persistence
  intl: ^0.19.0                # date formatting

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
