# Easiest path — generates ALL Android + iOS sizes (incl. adaptive) automatically.
#
# 1) Copy the four PNGs from ./master/ into your project's  assets/icon/  folder
#    (create it if needed): app_icon_1024.png, adaptive_foreground_1024.png,
#    adaptive_background_1024.png
# 2) Paste the block below into your pubspec.yaml (top level), then run:
#       flutter pub add dev:flutter_launcher_icons
#       dart run flutter_launcher_icons
#
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  image_path: "assets/icon/app_icon_1024.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_foreground: "assets/icon/adaptive_foreground_1024.png"
  adaptive_icon_background: "#7C3AED"
  web:
    generate: false
